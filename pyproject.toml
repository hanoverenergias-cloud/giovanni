[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cemig-form-filler"
version = "0.1.0"
description = "CEMIG distributed generation form extraction and safe workbook filling tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CEMIG Automation Team"}]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
  "pyyaml>=6.0",
  "streamlit>=1.35",
  "rich>=13.7",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
